<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Translate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header>
    <h1>AI Translate</h1>
    <a id="optionsLink" class="link" href="#">Options</a>
  </header>

  <label for="input">Input</label>
  <textarea id="input" placeholder="Type or paste text…"></textarea>

  <div class="row">
    <div style="flex:1">
      <label for="sourceLang">Source</label>
      <select id="sourceLang">
        <option value="auto">Auto</option>
        <option value="en">English</option>
        <option value="tr">Turkish</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
      </select>
    </div>
    <div style="flex:1">
      <label for="targetLang">Target</label>
      <select id="targetLang">
        <option value="en">English</option>
        <option value="tr">Turkish</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div style="flex:1">
      <label for="provider">Provider (override)</label>
      <select id="provider">
        <option value="">(Use default)</option>
        <option value="openai">OpenAI</option>
        <option value="openrouter">OpenRouter</option>
        <option value="gemini">Gemini</option>
        <option value="mistral">Mistral</option>
      </select>
    </div>
    <div style="flex:1">
      <label for="model">Model (override)</label>
      <select id="model"></select>
    </div>
  </div>

  <label for="temperature">Temperature (override)</label>
  <input id="temperature" type="number" min="0" max="2" step="0.1" placeholder="" />

  <div class="row">
    <button id="useSelection" class="btn">Use Page Selection</button>
    <button id="translateBtn" class="btn btn--primary">Translate</button>
  </div>

  <label for="output">Output</label>
  <textarea id="output" readonly placeholder="Translation appears here…"></textarea>

  <div class="row">
    <button id="copyBtn" class="btn">Copy</button>
    <button id="replaceInPage" class="btn">Replace Selection in Page</button>
    <button id="showToast" class="btn">Show Toast</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
